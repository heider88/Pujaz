services:
  # Firewall de aplicación: único punto publicado. Bloquea IP de la lista negra,
  # limita la frecuencia por IP y filtra peticiones maliciosas antes de los proxies.
  pz-waf-fw:
    build:
      context: ./Pz_waf_fw
    ports:
    - ${NGINX_PORT:-8080}:8080
    - ${NGINX_MOVIL_PORT:-8081}:8081
    volumes:
    - ./Pz_waf_fw/listas:/etc/nginx/listas:ro
    networks:
    - public
    - perimetro
    depends_on:
      pz-web-rp:
        condition: service_healthy
      pz-movil-rp:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/healthz && wget -q -O /dev/null http://127.0.0.1:8081/healthz
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  pz-web-rp:
    image: nginx:stable-alpine
    environment:
      GATEWAY_PORT: ${PORT:-4000}
      NGINX_ENVSUBST_FILTER: ^GATEWAY_PORT$$
    volumes:
    - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
    - perimetro
    - edge
    depends_on:
      pz-web-fe:
        condition: service_healthy
      pz-api-ag:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 5
  pz-movil-rp:
    image: nginx:stable-alpine
    environment:
      GATEWAY_PORT: ${PORT:-4000}
      NGINX_ENVSUBST_FILTER: ^GATEWAY_PORT$$
    volumes:
    - ./docker/nginx/movil.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
    - perimetro
    - edge
    depends_on:
      pz-web-fe:
        condition: service_healthy
      pz-api-ag:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 5

  pz-web-fe:
    build:
      context: ./Pz_web_fe
    environment:
      GATEWAY_URL: http://pz-api-ag:${PORT:-4000}/graphql
    networks:
    - edge
    depends_on:
      pz-api-ag:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  pz-api-ag:
    build:
      context: ./Pz_api_ag
      additional_contexts:
        contrato: ./docs/contrato
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET con al menos 32 caracteres}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      USE_MOCKS: ${USE_MOCKS:-false}
      MS_CATALOGO_URL: ${MS_CATALOGO_URL:-http://pz-catalogo-cl:8000}
      MS_SUBASTAS_URL: ${MS_SUBASTAS_URL:-http://pz-subastas-cl:8081}
      MS_BILLETERA_URL: ${MS_BILLETERA_URL:-http://pz-billetera-cl:8082}
      MS_USUARIOS_URL: ${MS_USUARIOS_URL:-http://pz-usuarios-cl:8080}
      MS_POSTPUJA_URL: ${MS_POSTPUJA_URL:-http://pz-postpuja-cl:8000}
      MS_NOTIFICACIONES_URL: ${MS_NOTIFICACIONES_URL:-http://pz-notificaciones-cl:8000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pz-eventos-mq:5672/}
    networks:
    - edge
    - backend
    - eventos
    depends_on:
      pz-catalogo-cl:
        condition: service_healthy
      pz-subastas-cl:
        condition: service_healthy
      pz-billetera-cl:
        condition: service_healthy
      pz-usuarios-cl:
        condition: service_healthy
      pz-postpuja-cl:
        condition: service_healthy
      pz-eventos-mq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:'' + process.env.PORT + ''/graphql?query=%7B__typename%7D'').then(async
        r => { const b = await r.json(); process.exit(r.ok && b.data?.__typename ===
        ''Query'' ? 0 : 1); }).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  pz-usuarios-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pujaz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USUARIOS_DB:-pujaz_usuarios}
    volumes:
    - usuarios_data:/var/lib/postgresql/data
    - ./Pz_usuarios_cl/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.sql:ro
    - ./Pz_usuarios_cl/migrations/000002_seed_data.up.sql:/docker-entrypoint-initdb.d/000002_seed_data.sql:ro
    networks:
    - datos-usuarios
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  pz-subastas-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pujaz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SUBASTAS_DB:-pujaz_subastas}
    volumes:
    - subastas_data:/var/lib/postgresql/data
    - ./Pz_subastas_cl/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.sql:ro
    - ./Pz_subastas_cl/migrations/000002_seed_data.up.sql:/docker-entrypoint-initdb.d/000002_seed_data.sql:ro
    networks:
    - datos-subastas
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  pz-billetera-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pujaz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BILLETERA_DB:-pujaz_billetera}
    volumes:
    - billetera_data:/var/lib/postgresql/data
    - ./Pz_billetera_cl/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.sql:ro
    - ./Pz_billetera_cl/migrations/000002_seed_data.up.sql:/docker-entrypoint-initdb.d/000002_seed_data.sql:ro
    networks:
    - datos-billetera
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  pz-catalogo-db:
    image: mongo:6
    volumes:
    - mongo_data:/data/db
    - ./Pz_catalogo_db/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
    - datos-catalogo
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  pz-catalogo-cl:
    build:
      context: ./Pz_catalogo_cl
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://pz-catalogo-db:27017}
    networks:
    - backend
    - datos-catalogo
    depends_on:
      pz-catalogo-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
  pz-postpuja-db:
    image: mongo:6
    volumes:
    - postpuja_data:/data/db
    networks:
    - datos-postpuja
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  pz-postpuja-cl:
    build:
      context: ./Pz_postpuja_cl
    environment:
      MONGO_URI: mongodb://pz-postpuja-db:27017
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pz-eventos-mq:5672/}
    networks:
    - backend
    - eventos
    - datos-postpuja
    depends_on:
      pz-postpuja-db:
        condition: service_healthy
      pz-eventos-mq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
  pz-notificaciones-db:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - notificaciones_data:/data
    networks:
    - datos-notificaciones
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  pz-eventos-mq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
    - eventos_data:/var/lib/rabbitmq
    networks:
    - eventos
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_running
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  pz-subastas-cl:
    build:
      context: ./Pz_subastas_cl
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pujaz_user}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@pz-subastas-db:5432/${POSTGRES_SUBASTAS_DB:-pujaz_subastas}?sslmode=disable
      PORT: '8081'
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pz-eventos-mq:5672/}
    networks:
    - backend
    - eventos
    - datos-subastas
    depends_on:
      pz-subastas-db:
        condition: service_healthy
      pz-eventos-mq:
        condition: service_healthy
      pz-billetera-cl:
        condition: service_healthy
      pz-notificaciones-cl:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8081/health
      interval: 10s
      timeout: 5s
      retries: 5
  pz-usuarios-cl:
    build:
      context: ./Pz_usuarios_cl
      dockerfile: Dockerfile
    environment:
      PORT: '8080'
      POSTGRES_USER: ${POSTGRES_USER:-pujaz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://pz-usuarios-db:5432/${POSTGRES_USUARIOS_DB:-pujaz_usuarios}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pz-eventos-mq:5672/}
    networks:
    - backend
    - eventos
    - datos-usuarios
    depends_on:
      pz-usuarios-db:
        condition: service_healthy
      pz-eventos-mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
  pz-billetera-cl:
    build:
      context: ./Pz_billetera_cl
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pujaz_user}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@pz-billetera-db:5432/${POSTGRES_BILLETERA_DB:-pujaz_billetera}?sslmode=disable
      PORT: '8082'
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pz-eventos-mq:5672/}
    networks:
    - backend
    - eventos
    - datos-billetera
    depends_on:
      pz-billetera-db:
        condition: service_healthy
      pz-eventos-mq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8082/health
      interval: 10s
      timeout: 5s
      retries: 5
  # Worker sin HTTP: espera a subastas saludable; restart supervisa su proceso.
  pz-cierre-cl:
    build:
      context: ./Pz_cierre_cl
    environment:
      SUBASTAS_SERVICE_URL: ${SUBASTAS_SERVICE_URL:-http://pz-subastas-cl:8081}
    networks:
    - backend
    depends_on:
      pz-subastas-cl:
        condition: service_healthy
    restart: unless-stopped
  pz-notificaciones-cl:
    build:
      context: ./Pz_notificaciones_cl
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pz-eventos-mq:5672/}
      REDIS_HOST: pz-notificaciones-db
      REDIS_PORT: '6379'
    networks:
    - backend
    - eventos
    - datos-notificaciones
    depends_on:
      pz-eventos-mq:
        condition: service_healthy
      pz-notificaciones-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
networks:
  # Zona pública: lo único que el host ve. Solo el firewall.
  public:
    driver: bridge
  # Perímetro: el firewall y los dos proxies inversos. Nadie llega a los proxies sin pasar por el firewall.
  perimetro:
    driver: bridge
    internal: true
  # Borde: proxy, front web (SSR) y gateway. El front no ve los microservicios.
  edge:
    driver: bridge
    internal: true
  # Lógica: el gateway y los microservicios (REST). Cierre solo habla con subastas.
  backend:
    driver: bridge
    internal: true
  # Eventos: RabbitMQ y solo quienes publican o consumen.
  eventos:
    driver: bridge
    internal: true
  # Datos: una red por microservicio; nadie ve la base de otro (database per service).
  datos-usuarios:
    driver: bridge
    internal: true
  datos-subastas:
    driver: bridge
    internal: true
  datos-billetera:
    driver: bridge
    internal: true
  datos-catalogo:
    driver: bridge
    internal: true
  datos-postpuja:
    driver: bridge
    internal: true
  datos-notificaciones:
    driver: bridge
    internal: true
volumes:
  usuarios_data: null
  subastas_data: null
  billetera_data: null
  mongo_data: null
  postpuja_data: null
  notificaciones_data: null
  eventos_data: null
