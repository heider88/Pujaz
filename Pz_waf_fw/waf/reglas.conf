# Reglas comunes a la entrada web (:8080) y a la móvil (:8081).
# $destino lo define cada server en nginx.conf.

limit_conn conexiones 30;

# Se evalúan antes de elegir la location, así que valen para cualquier ruta.
if ($ip_bloqueada) {
    return 403;
}
if ($metodo_no_permitido) {
    return 405;
}
if ($agente_malicioso) {
    return 403;
}
if ($uri_maliciosa) {
    return 403;
}

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
}

# Archivos ocultos (.env, .git, .htaccess...), salvo .well-known.
location ~ /\.(?!well-known/) {
    return 404;
}

# Extensiones y rutas que Pujaz no sirve y que buscan los escáneres.
location ~* \.(php\d?|aspx?|jsp|cgi|sql|bak|old|swp|ini|log)$ {
    return 404;
}
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|cgi-bin|actuator|server-status) {
    return 404;
}

# API GraphQL: HTTP y WebSocket del precio en vivo.
location = /graphql {
    limit_req zone=api burst=30 nodelay;
    proxy_pass $destino;
    include /etc/nginx/waf/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Páginas, archivos estáticos y fotos de los lotes.
location / {
    limit_req zone=general burst=100 nodelay;
    proxy_pass $destino;
    include /etc/nginx/waf/proxy.conf;
}
