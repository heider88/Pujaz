# Pz_waf_fw: firewall de aplicación delante de los dos proxies inversos.
# Internet → pz-waf-fw (:8080 web, :8081 móvil) → pz-web-rp / pz-movil-rp → front y gateway.
# Las listas de IP están en /etc/nginx/listas y se recargan sin reconstruir la imagen:
#   docker compose exec pz-waf-fw nginx -s reload

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    # TLS cliente -> WAF; upstreams en HTTP interno.
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Salud solo en loopback, sin entrada HTTP alternativa desde otras redes.
    server {
        listen 127.0.0.1:8090;
        location = /healthz { return 200 'ok'; }
        location / { return 404; }
    }

    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    # ---------- Listas de IP ----------
    # IP bloqueadas: reciben 403 en todo.
    geo $ip_bloqueada {
        default 0;
        include /etc/nginx/listas/ip-bloqueadas.conf;
    }

    # IP confiables: no cuentan para los límites de frecuencia (pruebas de carga, monitoreo).
    geo $ip_confiable {
        default 0;
        127.0.0.1 1;
        include /etc/nginx/listas/ip-confiables.conf;
    }

    # Clave vacía = la petición no se cuenta en la zona.
    map $ip_confiable $clave_limite {
        0 $binary_remote_addr;
        1 "";
    }

    # ---------- Límites de frecuencia por IP ----------
    # API GraphQL (consultas, mutaciones y el inicio de la suscripción WebSocket).
    limit_req_zone $clave_limite zone=api:10m rate=10r/s;
    # Páginas y archivos estáticos: una página de Next.js pide varios archivos de golpe.
    limit_req_zone $clave_limite zone=general:10m rate=30r/s;
    # Conexiones abiertas a la vez por IP (incluye los WebSocket).
    limit_conn_zone $clave_limite zone=conexiones:10m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # ---------- Reglas de filtrado ----------
    # Solo los métodos que usa Pujaz.
    map $request_method $metodo_no_permitido {
        default 1;
        GET 0;
        HEAD 0;
        POST 0;
        OPTIONS 0;
    }

    # Herramientas de escaneo y ataque conocidas.
    map $http_user_agent $agente_malicioso {
        default 0;
        "~*(sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|openvas|wpscan|dirbuster|gobuster|ffuf|nuclei|havij|w3af)" 1;
    }

    # Firmas comunes en la URL: recorrido de directorios, inyección SQL, XSS y archivos del sistema.
    map $request_uri $uri_maliciosa {
        default 0;
        "~*(\.\./|%2e%2e(%2f|/)|\.\.%2f)" 1;
        "~*(union(\s|%20|\+)+(all(\s|%20|\+)+)?select|information_schema|sleep\(|benchmark\()" 1;
        "~*(<|%3c)(\s|%20)*script" 1;
        "~*(javascript:|vbscript:)" 1;
        "~*(/etc/passwd|/proc/self|cmd\.exe|/bin/sh)" 1;
    }

    # ---------- Protección contra conexiones lentas (slowloris) y peticiones enormes ----------
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # DNS interno de Docker: el destino se resuelve en cada petición, así que el firewall
    # sigue funcionando si un proxy se reinicia y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Tráfico de la web (navegador).
    server {
        listen 8080 ssl;
        server_name _;
        set $destino http://pz-web-rp:80;
        include /etc/nginx/waf/reglas.conf;
    }

    # Tráfico de la app móvil.
    server {
        listen 8081 ssl;
        server_name _;
        set $destino http://pz-movil-rp:80;
        include /etc/nginx/waf/reglas.conf;
    }
}
