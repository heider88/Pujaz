server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pz-usuarios-db:5432/pujaz_usuarios}
spring.datasource.username=${POSTGRES_USER:pujaz_user}
spring.datasource.password=${POSTGRES_PASSWORD:pujaz_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@pz-eventos-mq:5672/}
